name: Build APK (stable signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not let two builds of the same branch publish indistinguishable updates.
concurrency:
  group: nexus-signed-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v4

      - name: Extract Nexus AI project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o Svyazka.zip
          test -f NexusIA/gradlew || { echo "Missing NexusIA/gradlew"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing identity
        env:
          NEXUS_SIGNING_BUNDLE: ${{ secrets.NEXUS_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PYTHON'
          import base64, io, os, pathlib, sys, zipfile
          secret = os.getenv('NEXUS_SIGNING_BUNDLE', '').strip()
          if not secret:
              sys.exit('Missing repository secret NEXUS_SIGNING_BUNDLE. Refusing unsigned APK.')
          try:
              bundle = base64.b64decode(secret, validate=True)
              with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
                  if set(archive.namelist()) != {'signing.p12', 'signing.pass'}:
                      sys.exit('Unexpected signing bundle files')
                  content = {name: archive.read(name) for name in ('signing.p12', 'signing.pass')}
              if not content['signing.p12'] or not content['signing.pass']:
                  sys.exit('Incomplete signing bundle')
          except (ValueError, zipfile.BadZipFile) as exc:
              sys.exit(f'Invalid signing bundle: {exc}')
          directory = pathlib.Path('NexusIA/build/manual')
          directory.mkdir(parents=True, exist_ok=True)
          for name, data in content.items():
              destination = directory / name
              destination.write_bytes(data)
              destination.chmod(0o600)
          print('Permanent signing credentials restored (values hidden).')
          PYTHON

      - name: Verify signing certificate identity
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="NexusIA/build/manual"
          actual="$(keytool -exportcert -alias svyazka -storetype PKCS12 \
            -keystore "$signing_dir/signing.p12" \
            -storepass "$(cat "$signing_dir/signing.pass")" | sha256sum | cut -d' ' -f1)"
          expected="658cb57254d29e79bd74c099dd3246b8715554ec6a4f2fdef863ef767c8a712a"
          if [ "$actual" != "$expected" ]; then
            echo 'Signing certificate differs from the original stable certificate. Stopping.'
            exit 1
          fi
          echo "Verified permanent signer SHA-256: $actual"

      - name: Assign increasing version code to every APK build
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from datetime import datetime, timezone
          import os, pathlib, re, sys

          path = pathlib.Path('NexusIA/app/build.gradle')
          contents = path.read_text(encoding='utf-8')
          pattern = r'(?m)^(\s*versionCode\s+)(\d+)\s*$'
          matches = list(re.finditer(pattern, contents))
          if len(matches) != 1:
              sys.exit('Cannot find exactly one versionCode in app/build.gradle')

          # GITHUB_RUN_NUMBER stays unchanged on reruns; use build time instead.
          # Seconds since 2020 fit Android's versionCode limit for decades.
          epoch = datetime(2020, 1, 1, tzinfo=timezone.utc)
          time_based_code = 100_000 + int((datetime.now(timezone.utc) - epoch).total_seconds())
          source_code = int(matches[0].group(2))
          version_code = max(time_based_code, source_code + 1)
          if not 1 <= version_code <= 2_100_000_000:
              sys.exit('versionCode is outside Android supported range')

          contents = re.sub(pattern, lambda match: match.group(1) + str(version_code), contents)
          path.write_text(contents, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'APK_VERSION_CODE={version_code}\n')
          print(f'APK versionCode: {version_code} (source: {source_code})')
          PYTHON

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd NexusIA
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify built APK version code
        shell: bash
        run: |
          set -euo pipefail
          apk='NexusIA/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt" || { echo 'Android aapt is missing'; exit 1; }
          "$aapt" dump badging "$apk" > /tmp/nexus-apk-badging.txt
          grep '^package:' /tmp/nexus-apk-badging.txt
          grep -Eq "^package: name='app.svyazka.team' versionCode='${APK_VERSION_CODE}'" /tmp/nexus-apk-badging.txt || {
            echo "Built APK versionCode differs from expected ${APK_VERSION_CODE}. Stopping."
            exit 1
          }
          echo "Built APK versionCode verified: ${APK_VERSION_CODE}"

      - name: Verify APK is signed by permanent certificate
        shell: bash
        run: |
          set -euo pipefail
          apk='NexusIA/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" || { echo 'apksigner missing'; exit 1; }
          "$apksigner" verify --print-certs "$apk" > /tmp/nexus-apk-signature.txt
          grep -Fiq '658cb57254d29e79bd74c099dd3246b8715554ec6a4f2fdef863ef767c8a712a' /tmp/nexus-apk-signature.txt || {
            echo 'APK signer does not match permanent certificate.'
            exit 1
          }
          echo 'APK signed and verified with permanent certificate.'

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-AI-signed-v${{ env.APK_VERSION_CODE }}
          path: NexusIA/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
