name: Nexus P0 Tests

# Repository wrapper for Svyazka.zip uploads. No signing or release publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: p0-source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract uploaded project ZIP
        working-directory: .
        run: |
          set -euo pipefail
          test -f Svyazka.zip
          unzip -tq Svyazka.zip
          mkdir p0-input
          unzip -q Svyazka.zip -d p0-input
          if [[ -f p0-input/NexusIA/gradlew ]]; then
            mv p0-input/NexusIA p0-source
          elif [[ -f p0-input/gradlew ]]; then
            mv p0-input p0-source
          else
            echo 'Project root not found in Svyazka.zip' >&2
            exit 1
          fi
          test -f p0-source/scripts/run-android-p0-ci.sh
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Verify source integrity
        id: integrity
        run: python3 -B scripts/check-source-integrity.py
      - name: Python regressions
        id: python_regression
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.python.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          python3 -B -m unittest discover -s tests 2>&1 | tee build/p0-evidence/local/python_regression.log
      - name: Translations
        id: translations
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.python.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          python3 -B scripts/check-resources.py 2>&1 | tee build/p0-evidence/local/translations.log
      - name: JVM contracts
        id: jvm
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.java.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          bash scripts/test-jvm.sh 2>&1 | tee build/p0-evidence/local/jvm.log
      - name: Pyodide worker
        id: pyodide
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.java.outcome == 'success' && steps.node.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          node tests/test-python-worker.mjs 2>&1 | tee build/p0-evidence/local/pyodide.log
      - name: Install browser test dependencies
        id: browser_setup
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.python.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          (python3 -m pip install playwright==1.62.0 && python3 -m playwright install --with-deps chromium) 2>&1 | tee build/p0-evidence/local/browser_setup.log
      - name: Chromium regression
        id: chromium
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.python.outcome == 'success' && steps.browser_setup.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence/local
          python3 -B scripts/test-web-preview.py 2>&1 | tee build/p0-evidence/local/chromium.log
      - name: Upload local test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-p0-local-reports
          path: p0-source/build/p0-evidence/local/
          if-no-files-found: warn
          retention-days: 7

  android-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            runs: 3
          - api: 30
            runs: 1
    defaults:
      run:
        working-directory: p0-source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract uploaded project ZIP
        working-directory: .
        run: |
          set -euo pipefail
          test -f Svyazka.zip
          unzip -tq Svyazka.zip
          mkdir p0-input
          unzip -q Svyazka.zip -d p0-input
          if [[ -f p0-input/NexusIA/gradlew ]]; then
            mv p0-input/NexusIA p0-source
          elif [[ -f p0-input/gradlew ]]; then
            mv p0-input p0-source
          else
            echo 'Project root not found in Svyazka.zip' >&2
            exit 1
          fi
          test -f p0-source/scripts/run-android-p0-ci.sh
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Verify source integrity
        id: integrity
        run: python3 -B scripts/check-source-integrity.py
      - uses: android-actions/setup-android@v3
        id: android_sdk
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        id: sdk_packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug and test APKs
        id: build_apks
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.java.outcome == 'success' && steps.sdk_packages.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence
          bash ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee build/p0-evidence/build-apks.log
      - name: Android JVM unit tests
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.java.outcome == 'success' && steps.sdk_packages.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence
          bash ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build/p0-evidence/gradle-unit.log
      - name: Android lint
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.java.outcome == 'success' && steps.sdk_packages.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/p0-evidence
          bash ./gradlew --no-daemon lintDebug 2>&1 | tee build/p0-evidence/lint.log
      - name: Enable KVM for Android emulator
        id: kvm
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.build_apks.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run real Android probes
        if: ${{ !cancelled() && steps.integrity.outcome == 'success' && steps.build_apks.outcome == 'success' && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd p0-source && mkdir -p build/p0-evidence && sha256sum ../Svyazka.zip > build/p0-evidence/source-zip-sha256.txt && bash scripts/run-android-p0-ci.sh ${{ matrix.runs }}
      - name: Upload reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-p0-api-${{ matrix.api }}-reports
          path: |
            p0-source/build/p0-evidence/
            p0-source/app/build/test-results/testDebugUnitTest/
            p0-source/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
