name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip project
      run: |
        unzip -o Svyazka.zip
        rm Svyazka.zip
        
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Gradle
      run: |
        # Этот скрипт сам найдет папку, где лежит gradlew, и зайдет в нее
        DIR=$(find . -name gradlew -type f -exec dirname {} \; | head -n 1)
        cd $DIR
        chmod +x ./gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # Ищет APK во всех папках на всякий случай
        path: '**/build/outputs/apk/debug/*.apk'
